[package]
name = "zenvi"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
default-run = "zenvi"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1", features = ["full"] }
rmpv = { version = "1.3", features = ["with-serde"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
unicode-width = "0.2"
resvg = "0.44"
usvg = "0.44"
