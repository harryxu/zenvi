[package]
name = "zenvi"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
default-run = "zenvi"

[dependencies]
# gpui = "0.2.2"
gpui-pre = "0.3.3"
gpui-platform = { package = "gpui-pre-platform", version = "0.3.3", features = ["font-kit"] }
tokio = { version = "1", features = ["full"] }
rmpv = { version = "1.3", features = ["with-serde"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
unicode-width = "0.2"
resvg = "0.44"
usvg = "0.44"

# Enable optimizations for all third-party dependencies in debug mode
# (GPUI, text shaping, font layout, and rendering libraries run at release speed,
# while your own zenvi code compiles incrementally in ~1s with full debug info).
[profile.dev.package."*"]
opt-level = 3

[workspace]
members = [
    ".",
    "perf_test_gpui",
]


